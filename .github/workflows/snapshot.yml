name: Data snapshot

# Keeps the committed CC BY snapshot in step with the live database, so the
# open data is usable without running the app or hitting the API.
on:
  schedule:
    - cron: "30 6 * * *"   # after the daily ingest
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/export-snapshot.mjs
      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # No commit when nothing moved, so the history stays meaningful.
          git diff --staged --quiet || git commit -m "data: refresh snapshot $(date -u +%Y-%m-%d)"
          git push
