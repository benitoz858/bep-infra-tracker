name: Ingest

# Runs the watchers on a schedule and stages what they find for human review.
# Nothing this workflow writes appears in any dashboard total: candidates land
# in the ingestion staging tables and only become evidence when someone accepts
# them at /ingest.
on:
  schedule:
    # 06:15 UTC daily — after US market close and before the London morning.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      watcher:
        description: "Single watcher key (blank = all)"
        required: false
      since:
        description: "ISO date to look back to (blank = 7 days)"
        required: false

concurrency:
  # Never let two ingest runs overlap: they would race on the URL unique index.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # This is a production job: missing configuration must fail visibly,
    # rather than report success without running ingestion.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check the database secret is configured
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is not set — ingestion did not run."
            exit 1
          fi

      - run: npm ci

      - name: Apply production migrations
        # The generated client can reference enum values/tables the deployed
        # database does not have yet. Stop before staging if migration fails.
        run: npm run db:deploy

      - name: Run watchers
        run: |
          ARGS=""
          if [ -n "${{ inputs.watcher }}" ]; then ARGS="$ARGS --watcher ${{ inputs.watcher }}"; fi
          if [ -n "${{ inputs.since }}" ]; then ARGS="$ARGS --since ${{ inputs.since }}"; fi
          npm run ingest -- $ARGS
